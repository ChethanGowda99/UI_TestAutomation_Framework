name: Test Automation Workflow

on:
  schedule:
    - cron: '00 18 * * *'
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Run Test Automation Framework with Maven
        run: mvn test -X -Dbrowser=chrome -DisLamdatest=false -DisHeadless=true

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: report.html

      - name: Test Execution is Completed
        if: always()
        run: echo "Test Execution is completed"
